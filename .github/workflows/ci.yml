name: CI

on:
  push:
    branches: [main, master, codex/sanctum-runtime-rearchitecture]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PowerShell (Linux orchestration tests)
        if: runner.os == 'Linux'
        uses: actions/setup-powershell@v1

      - run: npm ci
      - run: npm run verify
